const CHALLENGES=[['Knot Challenge','Tie a correct bowline blindfolded in 60 seconds.',20,-10],['Memory Challenge','Look at 10 objects for 15 seconds. Name 8 from memory.',30,-20],['Silent Challenge','Arrange patrol by birth month without speaking.',40,-10],['Courage Challenge','Guide one blindfolded member across a 10m path.',20,-20],['Honor Challenge','Give 20 TP to the patrol with the lowest score.',30,-10],['Teamwork Challenge','Carry a patrol member across the room using only arms.',40,-20],['Scout Skills','Bandage a simulated sprained ankle in under 2 minutes.',20,-10],['Night Adventure','Find a specific tree or landmark using only a compass bearing.',30,-20],['Wisdom Challenge','Solve: “I have a neck but no head, two arms but no hands.” Answer: A shirt.',40,-10],['Scout Spirit','Sing a camp song loudly for 30 seconds.',20,-20],['Navigation Challenge','Point to True North without using a compass.',30,-20],['Fire Safety','List the Fire Triangle: Heat, Fuel, Oxygen.',40,-20],['Observation','Find 3 items in nature that are perfectly round.',20,-10],['First Aid','Demonstrate how to treat a minor burn.',30,-20],['Physical Challenge','Entire patrol holds a plank for 45 seconds.',40,-20],['Pioneering','Tie a square lashing using two sticks and string in 2 minutes.',20,-20],['Leadership','Youngest member directs patrol to form a perfect circle blindfolded.',30,-20],['Survival','Name 5 essential items in a survival kit.',40,-20],['Trust Challenge','Perform a trust fall with a patrol member.',20,-10],['Morse Code','Tap out S.O.S. using a flashlight or rock.',30,-20]].map((x,i)=>({id:'challenge-'+i,type:'challenge',name:x[0],text:x[1],success:x[2],failure:x[3]}));

function initialState(hostId,hostName,code){return {code,hostId,hostName,status:'LOBBY',phase:'LOBBY',turnIndex:0,patrols:[],bases:Object.fromEntries(BASES.map(x=>[x.id,{ownerId:null,level:0}])),decks:Object.fromEntries(Object.entries(DECKS).map(([k,v])=>[k,{draw:shuffle(v.map(x=>x.id)),discard:[]}])),events:[{message:`${hostName} opened the Scoutopoly lodge.`,time:now(),type:'system'}],trades:[],currentCard:null,station:null,lastRoll:null,lastMove:null,players:{[hostId]:{role:'host',name:hostName}},settings:{nightMode:true,sound:false,reducedMotion:false},lastUndo:null,final:null};}

function event(s,message,type='event'){s.events=[{message,time:now(),type},...(s.events||[])].slice(0,120)} 
function patrol(id){return state?.patrols.find(p=>p.id===id)} 
function current(){return state?.patrols[state?.turnIndex||0]} 
function myPatrol(){return state?.patrols.find(p=>p.uid===user?.uid)} 
function isHost(){return !!state&&state.hostId===user?.uid} 
function canAct(){return state?.status==='PLAYING'&&current()?.uid===user?.uid&&state.phase==='PLAYING'} 
function score(p){return p.trailPoints+(p.ownedBases||[]).reduce((n,id)=>n+(baseById[id]?.cost||0),0)+p.honor*10}
function shortCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}

function tell(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),4000)}
function setModal(html){if(modalRoot)modalRoot.innerHTML=`<div class="modal-layer" role="dialog" aria-modal="true"><section class="modal">${html}</section></div>`}
function closeModal(){if(modalRoot)modalRoot.innerHTML=''}
function snapshot(s){return {patrols:clone(s.patrols),bases:clone(s.bases),turnIndex:s.turnIndex,phase:s.phase,status:s.status,currentCard:clone(s.currentCard),station:clone(s.station),lastRoll:s.lastRoll,lastMove:clone(s.lastMove),trades:clone(s.trades),decks:clone(s.decks)}}

async function mutate(label,fn,{undo=true}={}){
  if(!gameId||!user)throw Error('Open or join a game first.');
  const ref=doc(db,'games',gameId,'private','state');
  await runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(!snap.exists())throw Error('Game state was not found.');
    const s=snap.data(); 
    if(!s.players?.[user.uid])throw Error('You are not a member of this game.'); 
    if(undo)s.lastUndo=snapshot(s); 
    await fn(s); 
    event(s,label);
    tx.set(ref,s)
  }).catch(e=>{console.error(e);tell(e.message||'That action could not be completed.');throw e})
}

async function createGame(){
  const name=$('#new-gm')?.value.trim()||'Game Master',gameName=$('#new-name')?.value.trim()||'Scoutopoly Night Game';
  if(!user)return tell('Connecting your account…');
  let code=shortCode();
  for(let i=0;i<4;i++){const q=query(collection(db,'games'),where('code','==',code),limit(1));if((await getDocs(q)).empty)break;code=shortCode()}
  const game=await addDoc(collection(db,'games'),{code,name:gameName,hostId:user.uid,createdAt:now()});
  await setDoc(doc(db,'games',game.id,'private','state'),initialState(user.uid,name,code));
  gameId=game.id;
  try{localStorage.scoutopolyGame=gameId;localStorage.scoutopolyRole='host'}catch(e){}
  watchGame();
  closeModal();
  tell(`Game code ${code} created.`);
}

async function joinByCode(){
  const code=$('#join-code')?.value.trim().toUpperCase();
  if(!code)return tell('Enter the five-character game code.');
  const q=query(collection(db,'games'),where('code','==',code),limit(1)),res=await getDocs(q);
  if(res.empty)return tell('Unable to join game. Check the code.');
  gameId=res.docs[0].id;
  try{localStorage.scoutopolyGame=gameId}catch(e){}
  watchGame();
  closeModal();
}

function watchGame(){
  unsub?.();
  if(!gameId)return render();
  unsub=onSnapshot(doc(db,'games',gameId,'private','state'),snap=>{
    if(!snap.exists()){tell('This game is no longer available.');leaveGame();return}
    state=snap.data();
    render(); 
    if(state.phase==='MOVING'&&state.lastMove?.driver===user?.uid)driveMovement();
  },e=>{console.error(e);tell('Connection lost. Reconnecting…')});
}

async function addPatrol(){
  const name=$('#patrol-name')?.value.trim(),members=$('#patrol-members')?.value.trim(),token=$('#patrol-token')?.value;
  if(!name)return tell('Give the patrol a name.');
  const ref=doc(db,'games',gameId,'private','state');
  try{
    await runTransaction(db,async tx=>{
      const snap=await tx.get(ref);
      if(!snap.exists())throw Error('Game state was not found.');
      const s=snap.data();
      if(s.status!=='LOBBY')throw Error('The game has already started.');
      if(s.patrols.some(p=>p.name.toLowerCase()===name.toLowerCase()))throw Error('A patrol already has that name.');
      if(s.patrols.some(p=>p.uid===user.uid))throw Error('This account already represents a patrol.');
      s.lastUndo=snapshot(s);
      s.patrols.push({id:crypto.randomUUID(),uid:user.uid,name,members,token,position:0,trailPoints:500,honor:0,ownedBases:[],cards:[],missedTurns:0,notes:[],brave:false,protected:false});
      s.players[user.uid]={role:'patrol',name};
      event(s,`${name} joined the lodge.`);
      tx.set(ref,s)
    });
  }catch(e){tell(e.message||'Unable to add patrol.');return}
  try{localStorage.scoutopolyPatrol='yes'}catch(e){}
  closeModal();
}

async function startGame(){
  if(!isHost())return;
  if(!state.patrols.length)return tell('Add at least one patrol before starting.');
  await mutate('The Game Master started the adventure.',s=>{s.status='PLAYING';s.phase='PLAYING';s.turnIndex=0});
}

async function rollDice(){
  if(!canAct())return tell('It is not your patrol’s turn.');
  const n=1+Math.floor(Math.random()*6);
  await mutate(`${current().name} rolled ${n}.`,s=>{
    const p=s.patrols[s.turnIndex];
    s.lastRoll=n;
    s.phase='MOVING';
    s.lastMove={from:p.position,remaining:n,total:n,driver:user.uid};
  });
}

async function driveMovement(){
  if(!state?.lastMove||state.lastMove.driver!==user?.uid)return;
  setTimeout(async()=>{
    if(!state||state.phase!=='MOVING'||state.lastMove?.driver!==user.uid)return;
    try{
      await mutate('Movement step.',s=>{
        const p=s.patrols[s.turnIndex],m=s.lastMove;
        if(!m||m.driver!==user.uid)throw Error('Movement is being handled elsewhere.');
        p.position=(p.position+1)%BOARD.length;
        m.remaining--;
        if(p.position===0){p.trailPoints+=200;event(s,`${p.name} passed START and collected +200 TP.`,'money')}
        if(m.remaining<=0){
          s.phase='RESOLVING';
          event(s,`${p.name} arrived at ${BOARD[p.position].name}.`);
          s.lastMove=null;
        }
      },{undo:false});
    }catch(e){}
  },state.settings?.reducedMotion?0:260);
}

async function resolveLanding(){
  if(!state||state.phase!=='RESOLVING')return;
  const p=current(),space=BOARD[p.position];
  if(space.type==='base'){
    const own=state.bases[space.id];
    if(!own.ownerId){await mutate(`${p.name} can buy ${space.name}.`,s=>s.phase='BUYING')}
    else if(own.ownerId===p.id){await mutate(`${p.name} reached their own ${space.name}.`,s=>s.phase='PLAYING')}
    else{
      await mutate(`${p.name} paid rent at ${space.name}.`,s=>{
        const owner=s.patrols.find(x=>x.id===s.bases[space.id].ownerId),rent=space.rents[s.bases[space.id].level];
        if(p.trailPoints<rent)throw Error('Insufficient Trail Points to pay rent. Ask the Game Master for an adjustment.');
        p.trailPoints-=rent;
        owner.trailPoints+=rent;
        s.phase='PLAYING';
        event(s,`${p.name} paid ${owner.name} ${rent} TP rent for ${space.name}.`,'money');
      });
    }
  }else if(space.type==='challenge')await drawCard('challenge');
  else if(space.type==='opportunity')await drawCard('opportunity');
  else if(space.type==='law')await drawCard('law');
  else if(space.type==='spirit')await drawCard('spirit');
  else if(space.type==='station')await mutate(`${p.name} arrived at ${space.station} station.`,s=>{s.phase='STATION';s.station={patrolId:p.id,name:space.station,startedAt:null,seconds:180}});
  else if(space.type==='goto')await mutate(`${p.name} went to Reflection.`,s=>{p.position=10;p.honor-=20;s.phase='REFLECTION';event(s,`${p.name} entered Reflection and lost 20 Honor.`)});
  else await mutate(`${p.name} resolved ${space.name}.`,s=>s.phase='PLAYING');
}

function getCard(s,type){
  let d=s.decks[type];
  if(!d.draw.length){d.draw=shuffle(d.discard);d.discard=[]}
  const id=d.draw.shift();
  return cardById[id];
}

async function drawCard(type){
  await mutate(`${current().name} drew a ${cap(type)} card.`,s=>{
    const c=getCard(s,type),p=s.patrols[s.turnIndex];
    if(!c)throw Error(`The ${type} deck is empty.`);
    s.currentCard={...c,patrolId:p.id};
    s.phase=type==='opportunity'?'OPPORTUNITY':type==='law'?'SCOUT_LAW':type==='spirit'?'SCOUT_SPIRIT':'CHALLENGE';
    if(type==='opportunity')applyOpportunity(s,c,p);
    if(type==='spirit')prepareSpirit(s,c,p);
    if(type==='challenge'&&p.cards.some(x=>x.id==='spirit-6')&&c.name==='Courage Challenge')s.currentCard.autoPass=true;
  });
}

function discard(s,c){const d=s.decks[c.type];if(!d.discard.includes(c.id))d.discard.push(c.id)}
function keep(s,p,c){p.cards.push({id:c.id,type:c.type,name:c.name});discard(s,c)}

function applyPenalty(s,p,amount,reason){
  if(p.protected){p.protected=false;event(s,`${p.name} used protection to ignore ${reason}.`);return false}
  p.trailPoints+=amount;
  return true;
}

function applyOpportunity(s,c,p){
  switch(c.effect){
    case'tp':{
      const applied=c.value<0?applyPenalty(s,p,c.value,c.name):(p.trailPoints+=c.value,true);
      finishCard(s,c,`${p.name} ${c.value>=0?'received':applied?'paid':'ignored'} ${Math.abs(c.value)} TP.`);
      break;
    }
    case'skip':p.missedTurns++;finishCard(s,c,`${p.name} will miss the next turn.`);break;
    case'back':p.position=(p.position-c.value+40)%40;finishCard(s,c,`${p.name} moved back ${c.value} spaces.`);break;
    case'start':p.position=0;p.trailPoints+=200;finishCard(s,c,`${p.name} advanced to START and collected 200 TP.`);break;
    case'campfire':p.position=20;finishCard(s,c,`${p.name} moved to FREE CAMPFIRE.`);break;
    case'keep':keep(s,p,c);s.currentCard=null;s.phase='PLAYING';event(s,`${p.name} kept ${c.name}.`);break;
    case'both':s.currentCard.needsTarget=true;break;
    case'station':s.currentCard.needsStation=true;break;
  }
}

function prepareSpirit(s,c,p){
  if(c.effect==='tp'){p.trailPoints+=c.value;finishCard(s,c,`${p.name} gained ${c.value} TP.`)}
  else if(c.effect==='honor'){p.honor+=c.value;finishCard(s,c,`${p.name} gained +${c.value} Honor.`)}
  else if(c.effect==='scoutMaster'){
    let total=0;
    s.patrols.forEach(x=>{if(x.id!==p.id){const v=Math.min(c.value,x.trailPoints);x.trailPoints-=v;total+=v}});
    p.trailPoints+=total;
    finishCard(s,c,`${p.name} collected ${total} TP from other patrols.`);
  }else if(c.effect==='keep'){keep(s,p,c);s.currentCard=null;s.phase='PLAYING';event(s,`${p.name} kept ${c.name}.`)}
  else if(c.effect==='brotherhood')s.currentCard.needsTarget=true;
  else if(c.effect==='nightHawk')s.currentCard.needsNight=true;
  else if(c.effect==='wilderness')s.currentCard.needsWilderness=true;
}

function finishCard(s,c,message){discard(s,c);s.currentCard=null;s.phase='PLAYING';event(s,message,'card')}

async function resolveCard(pass){
  const c=state.currentCard;
  if(!c)return; 
  if(!isHost()&&c.type!=='opportunity')return tell('The Game Master verifies this real-world task.');
  await mutate(`${current().name} ${pass?'passed':'failed'} ${c.name}.`,s=>{
    const card=s.currentCard,p=s.patrols.find(x=>x.id===card.patrolId),mult=p.brave?2:1;
    if(card.type==='challenge'){
      if(pass||card.autoPass){p.trailPoints+=card.success*mult;event(s,`${p.name} received +${card.success*mult} TP for ${card.name}.`)}
      else{
        const applied=applyPenalty(s,p,card.failure*mult,`${card.name} failure`);
        event(s,`${p.name} ${applied?'lost '+Math.abs(card.failure*mult)+' TP':'ignored the challenge penalty'} for ${card.name}.`);
      }
      p.brave=false;
      finishCard(s,card,`${p.name} resolved ${card.name}.`);
    }else if(card.type==='law'){
      if(card.name==='Brave'&&pass){p.brave=true;finishCard(s,card,`${p.name} accepted a double-or-nothing next challenge.`)}
      else if(pass){p.trailPoints+=card.success;finishCard(s,card,`${p.name} received +${card.success} TP for ${card.name}.`)}
      else finishCard(s,card,`${p.name} did not complete ${card.name}.`);
    }
  });
}

async function chooseCardTarget(targetId){
  const c=state.currentCard;
  await mutate(`${current().name} resolved ${c.name}.`,s=>{
    const card=s.currentCard,p=s.patrols.find(x=>x.id===card.patrolId),target=s.patrols.find(x=>x.id===targetId);
    if(!target||target.id===p.id)throw Error('Choose another patrol.');
    if(card.effect==='both'||card.effect==='brotherhood'){
      p.trailPoints+=card.value;
      target.trailPoints+=card.value;
      finishCard(s,card,`${p.name} and ${target.name} each gained ${card.value} TP.`);
    }
  });
}

async function chooseSpecial(kind){
  const c=state.currentCard;
  await mutate(`${current().name} resolved ${c.name}.`,s=>{
    const card=s.currentCard,p=s.patrols.find(x=>x.id===card.patrolId);
    if(kind==='station'){
      let n=1;while(BOARD[(p.position+n)%40].type!=='station')n++;
      p.position=(p.position+n)%40;
      finishCard(s,card,`${p.name} took a shortcut to ${BOARD[p.position].name}.`);
    }
    if(kind==='night'){p.position=26;finishCard(s,card,`${p.name} flew to Night Hike Trail.`)}
    if(kind==='wilderness'){
      const d=s.decks.challenge;
      const three=d.draw.splice(0,3).reverse();
      d.draw.unshift(...three);
      finishCard(s,card,`${p.name} rearranged the next three Challenge cards.`);
    }
  });
}

async function buyBase(){
  const sp=BOARD[current().position];
  await mutate(`${current().name} bought ${sp.name} for ${sp.cost} TP.`,s=>{
    const p=s.patrols[s.turnIndex],own=s.bases[sp.id];
    if(own.ownerId)throw Error('Another patrol already owns this base.');
    if(p.trailPoints<sp.cost)throw Error('Insufficient Trail Points.');
    p.trailPoints-=sp.cost;
    p.ownedBases.push(sp.id);
    own.ownerId=p.id;
    own.level=0;
    s.phase='PLAYING';
  });
}

async function passBase(){await mutate(`${current().name} passed on this base.`,s=>s.phase='PLAYING')}

async function upgradeBase(id){
  const base=baseById[id];
  await mutate(`${current().name} upgraded ${base.name}.`,s=>{
    const p=s.patrols[s.turnIndex],own=s.bases[id];
    if(own.ownerId!==p.id)throw Error('Only the owner may upgrade this base.');
    if(own.level>=3)throw Error('This base is already Level 3.');
    if(p.trailPoints<base.upgrade)throw Error('Insufficient Trail Points.');
    p.trailPoints-=base.upgrade;
    own.level++;
    event(s,`${p.name} upgraded ${base.name} to Level ${own.level}.`);
    s.phase='PLAYING';
  });
}

async function endTurn(){
  if(!canAct())return tell('Finish the current action first.');
  await mutate(`${current().name} ended their turn.`,s=>advanceTurn(s));
}

function advanceTurn(s){
  let tries=0;
  do{
    s.turnIndex=(s.turnIndex+1)%s.patrols.length;
    const p=s.patrols[s.turnIndex];
    if(p.missedTurns>0){p.missedTurns--;event(s,`${p.name} missed a turn.`);tries++}
    else break;
  }while(tries<s.patrols.length);
  s.phase='PLAYING';
  s.lastRoll=null;
}

async function stationStart(){
  if(!isHost())return;
  await mutate(`${state.station.name} timer started.`,s=>{s.station.startedAt=now();s.station.seconds=180});
}

async function stationResolve(success){
  if(!isHost())return;
  await mutate(`${state.station.name} ${success?'passed':'failed'}.`,s=>{
    s.phase='PLAYING';
    if(success)s.station.rewardPending=true;
    else{s.station=null;event(s,'The station challenge was not completed.')}
  });
}

async function stationReward(){
  const form=$('#station-reward');
  const type=form?.reward?.value,amount=Number(form?.amount?.value||0),base=form?.base?.value;
  await mutate('The Game Master granted the station reward.',s=>{
    const p=s.patrols.find(x=>x.id===s.station.patrolId);
    if(type==='tp'){
      if(amount<=0)throw Error('Enter the Trail Points reward chosen by the Game Master.');
      p.trailPoints+=amount;
      event(s,`${p.name} received ${amount} TP from ${s.station.name}.`);
    }else{
      if(!base||s.bases[base].ownerId!==p.id||s.bases[base].level>=3)throw Error('Choose an owned base below Level 3.');
      s.bases[base].level++;
      event(s,`${p.name} received a free upgrade for ${baseById[base].name}.`);
    }
    s.station=null;
  });
}

async function proposeTrade(){
  const f=$('#trade-form'),to=f?.to?.value,offerTp=Number(f?.offerTp?.value||0),requestTp=Number(f?.requestTp?.value||0),offerBase=f?.offerBase?.value||null,requestBase=f?.requestBase?.value||null;
  if(!to)return tell('Choose a receiving patrol.');
  await mutate(`${current().name} proposed a trade.`,s=>{
    const p=s.patrols[s.turnIndex],target=s.patrols.find(x=>x.id===to);
    if(!target||target.id===p.id)throw Error('Choose another patrol.');
    if(offerTp>p.trailPoints)throw Error('Your offered TP exceeds your balance.');
    if(offerBase&&!p.ownedBases.includes(offerBase))throw Error('You do not own the offered base.');
    s.trades.unshift({id:crypto.randomUUID(),from:p.id,to:target.id,offerTp,requestTp,offerBase,requestBase,status:'PENDING',createdAt:now()});
    s.phase='PLAYING';
  });
}

async function tradeDecision(id,decision){
  const trade=state.trades.find(x=>x.id===id);
  if(!trade)return;
  const recipient=patrol(trade.to);
  if(!isHost()&&recipient?.uid!==user?.uid)return tell('Only the receiving patrol may respond.');
  if(decision==='counter'){return openTrade(true,trade)}
  await mutate(`${recipient.name} ${decision}ed a trade.`,s=>{
    const t=s.trades.find(x=>x.id===id),from=s.patrols.find(x=>x.id===t.from),to=s.patrols.find(x=>x.id===t.to);
    if(decision==='reject'){t.status='REJECTED';return}
    if(from.trailPoints<t.offerTp||to.trailPoints<t.requestTp)throw Error('One patrol no longer has the offered Trail Points.');
    if(t.offerBase&&!from.ownedBases.includes(t.offerBase))throw Error('The offered base is no longer available.');
    if(t.requestBase&&!to.ownedBases.includes(t.requestBase))throw Error('The requested base is no longer available.');
    from.trailPoints+=t.requestTp-t.offerTp;
    to.trailPoints+=t.offerTp-t.requestTp;
    transferBase(s,t.offerBase,from,to);
    transferBase(s,t.requestBase,to,from);
    t.status='ACCEPTED';
    event(s,`${from.name} and ${to.name} completed a trade.`,'money');
  });
}

function transferBase(s,id,from,to){if(!id)return;from.ownedBases=from.ownedBases.filter(x=>x!==id);to.ownedBases.push(id);s.bases[id].ownerId=to.id}

async function gmAdjust(kind){
  const p=patrol($('#gm-patrol')?.value),amount=Number($('#gm-amount')?.value||0);
  if(!p||!amount)return tell('Select a patrol and an amount.');
  await mutate(`Game Master adjusted ${p.name}.`,s=>{
    const x=s.patrols.find(a=>a.id===p.id);
    if(kind==='tp')x.trailPoints+=amount;else x.honor+=amount;
    event(s,`${x.name} ${amount>0?'received':'lost'} ${Math.abs(amount)} ${kind==='tp'?'TP':'Honor'} by Game Master.`);
  });
}

async function gmUnsafe(){
  const id=$('#gm-patrol')?.value;
  if(!id)return tell('Select a patrol.');
  await mutate('Game Master recorded unsafe behavior.',s=>{
    const p=s.patrols.find(x=>x.id===id);
    p.position=10;
    p.honor-=20;
    s.phase='REFLECTION';
    event(s,`${p.name} entered Reflection for unsafe behavior and lost 20 Honor.`);
  });
}

async function gmAdvance(){await mutate('Game Master advanced the turn.',s=>advanceTurn(s))} 
async function gmPause(){await mutate(`Game Master ${state.status==='PAUSED'?'resumed':'paused'} the game.`,s=>{s.status=s.status==='PAUSED'?'PLAYING':'PAUSED';if(s.status==='PLAYING')s.phase='PLAYING'})} 
async function gmUndo(){await mutate('Game Master undid the last action.',s=>{if(!s.lastUndo)throw Error('There is no action to undo.');Object.assign(s,clone(s.lastUndo));s.lastUndo=null},{undo:false})}
async function gmEnd(){await mutate('Game Master ended Scoutopoly.',s=>{s.status='FINISHED';s.phase='FINISHED';s.final=s.patrols.map(p=>({id:p.id,name:p.name,token:p.token,trail:p.trailPoints,bases:p.ownedBases.reduce((n,id)=>n+(baseById[id]?.cost||0),0),honor:p.honor,score:p.trailPoints+p.ownedBases.reduce((n,id)=>n+(baseById[id]?.cost||0),0)+p.honor*10})).sort((a,b)=>b.score-a.score)})}
async function gmMove(){
  const id=$('#gm-patrol')?.value,pos=Number($('#gm-position')?.value);
  if(!Number.isInteger(pos)||pos<0||pos>=40)return tell('Enter a board position from 0 to 39.');
  await mutate('Game Master moved a patrol token.',s=>{
    const p=s.patrols.find(x=>x.id===id);
    p.position=pos;
    event(s,`${p.name} was moved to ${BOARD[pos].name} by Game Master.`);
  });
}

async function gmSkip(){
  const id=$('#gm-patrol')?.value;
  await mutate('Game Master skipped a patrol turn.',s=>{
    const p=s.patrols.find(x=>x.id===id);
    p.missedTurns++;
    event(s,`${p.name} will miss their next turn.`);
  });
}

async function gmCard(mode){
  const id=$('#gm-patrol')?.value,cardId=$('#gm-card')?.value;
  await mutate(`Game Master ${mode}d a card.`,s=>{
    const p=s.patrols.find(x=>x.id===id),c=cardById[cardId];
    if(mode==='give'){
      if(p.cards.some(x=>x.id===cardId))throw Error('That patrol already holds this card.');
      p.cards.push({id:c.id,type:c.type,name:c.name});
      for(const d of Object.values(s.decks)){d.draw=d.draw.filter(x=>x!==cardId);d.discard=d.discard.filter(x=>x!==cardId)}
      event(s,`${p.name} received ${c.name} from Game Master.`);
    }else{
      if(!p.cards.some(x=>x.id===cardId))throw Error('That patrol does not hold this card.');
      p.cards=p.cards.filter(x=>x.id!==cardId);
      s.decks[c.type].discard.push(cardId);
      event(s,`${p.name} had ${c.name} removed by Game Master.`);
    }
  });
}

async function gmBase(){
  const id=$('#gm-base')?.value,owner=$('#gm-owner')?.value||null,level=Number($('#gm-level')?.value);
  await mutate('Game Master corrected base ownership.',s=>{
    const b=s.bases[id],old=s.patrols.find(x=>x.id===b.ownerId),next=s.patrols.find(x=>x.id===owner);
    if(old)old.ownedBases=old.ownedBases.filter(x=>x!==id);
    if(next&&!next.ownedBases.includes(id))next.ownedBases.push(id);
    b.ownerId=owner;
    b.level=owner?Math.max(0,Math.min(3,level)):0;
    event(s,`${baseById[id].name} ownership was set to ${next?.name||'Unowned'} (Level ${b.level}).`);
  });
}

async function authEmail(mode){
  try{
    const e=$('#auth-email')?.value.trim(), p=$('#auth-password')?.value;
    if(!e || !p) return tell('Please enter both username/email and password.');
    
    if(e==='chef' && p==='ch@f'){
      await signInAnonymously(auth);
      try{localStorage.scoutopolyChef='yes';localStorage.removeItem('scoutopolyMember')}catch(err){}
      closeModal();
      tell('Logged in as the Game Master Chef.');
      render();
      return;
    }
    
    if(mode==='login'){
      if(e.length > 0){
        try {
          const ref = doc(db, 'member_logins', e);
          const snap = await getDoc(ref);
          if(snap.exists() && snap.data().password === p){
            await signInAnonymously(auth);
            try{localStorage.scoutopolyMember = e;localStorage.removeItem('scoutopolyChef')}catch(err){}
            closeModal();
            tell(`Logged in securely as member: ${e}`);
            render();
            return;
          }
        } catch(memberErr) {
          console.warn('Member lookup skipped or failed:', memberErr);
        }
      }
      if(!e.includes('@')){
        throw Error('Invalid member credentials or email format. Registered members enter your username; others enter a valid email.');
      }
      await signInWithEmailAndPassword(auth,e,p);
    } else {
      if(!e.includes('@')){
        throw Error('Creating an email account requires a valid email address containing "@".');
      }
      await createUserWithEmailAndPassword(auth,e,p);
    }
    
    try{localStorage.removeItem('scoutopolyChef');localStorage.removeItem('scoutopolyMember')}catch(err){}
    closeModal();
    tell('Signed in successfully.');
  } catch(err){ tell(err.message || 'Authentication error occurred.') }
}

function openTrade(counter=false,t=null){

async function counterTrade(oldId){
  const f=$('#trade-form'),to=f?.to?.value,offerTp=+f?.offerTp?.value||0,requestTp=+f?.requestTp?.value||0,offerBase=f?.offerBase?.value||null,requestBase=f?.requestBase?.value||null;
  await mutate(`${current().name} countered a trade.`,s=>{
    const old=s.trades.find(x=>x.id===oldId);
    old.status='COUNTERED';
    const p=s.patrols[s.turnIndex];
    s.trades.unshift({id:crypto.randomUUID(),from:p.id,to,offerTp,requestTp,offerBase,requestBase,status:'PENDING',createdAt:now()});
    s.phase='PLAYING';
  });
  closeModal();
}

  <button class="btn" onclick="openAuth()">${memName ? esc(memName) : isChef ? 'Chef Mode' : 'Account'}</button>
  ${isHost()?`<button class="btn gold" onclick="openGM()">GM control</button>`:''}</div></header><div class="shell"><aside class="side panel left-side"><div class="turn-card"><div class="panel-title">${state.status==='LOBBY'?'Live Lobby':'Current turn'}</div><div class="turn-name">${p?`${p.token} ${esc(p.name)}`:'Waiting for patrols'}</div><div class="action-note">${state.status==='LOBBY'?`Game code <b>${state.code}</b>. Share it, then have each patrol join.`:state.phase.replace('_',' ')}</div>${renderedAction()}</div>${mine?`<div><div class="panel-title">Your patrol</div><div class="stat-grid"><div class="stat"><b>${mine.trailPoints}</b><span>Trail Points</span></div><div class="stat"><b>${mine.honor}</b><span>Honor</span></div><div class="stat"><b>${mine.ownedBases.length}</b><span>Bases</span></div><div class="stat"><b>${score(mine)}</b><span>Est. score</span></div></div></div><div><div class="panel-title">Owned bases</div><div class="base-list">${mine.ownedBases.length?mine.ownedBases.map(id=>{const x=baseById[id],o=state.bases[id];return `<div class="base-item"><b>${x.name}</b>Level ${o.level} · Rent ${x.rents[o.level]} TP <button class="btn tiny" onclick="upgradeBase('${id}')" ${(canAct()&&o.level<3)?'':'disabled'}>Upgrade ${x.upgrade}</button></div>`}).join(''):'<span class="pill">No bases yet</span>'}</div></div><div><div class="panel-title">Held cards</div><div class="card-list">${mine.cards.length?mine.cards.map(c=>`<button class="held-card" onclick="useHeldCard('${c.id}')">${esc(c.name)}<br><small>Use card</small></button>`).join(''):'<span class="pill">No saved cards</span>'}</div></div>`:`<div><div class="panel-title">Host lobby</div><p class="action-note">You are the Game Master. Add a patrol only if you are also playing.</p></div>`}<div class="safety"><b>SAFETY FIRST</b><br>NO running in the dark without flashlights.<br>NO physical contact during competitive challenges.<br>Unsafe behavior: immediate Reflection and loss of Honor.</div></aside><section>${state.status==='LOBBY'?renderLobby():renderBoard()}<nav class="mobile-actions">${state.status==='LOBBY'?`<button class="btn gold" onclick="openPatrol()">Add patrol</button>${isHost()?`<button class="btn" onclick="startGame()">Start</button>`:''}`:`${renderedAction()}<button class="btn" onclick="openMobileInfo()">Info</button>`}</nav></section><aside class="panel right-side"><section class="leader"><div class="panel-title">Live leaderboard</div>${rank.map((x,i)=>`<div class="leader-row"><span class="rank">${i+1}</span><div>${x.token} <b>${esc(x.name)}</b><div class="progress"><i style="width:${Math.min(100,score(x)/12)}%"></i></div></div><b>${state.status==='FINISHED'?score(x):x.trailPoints} <small>TP</small></b></div>`).join('')}</section><section class="feed"><div class="panel-title">Activity trail</div>${state.events.slice(0,25).map(e=>`<div class="event">${esc(e.message)}<time>${new Date(e.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</time></div>`).join('')}</section></aside></div>`;
}

function renderLobby(){
  return `<section class="panel side"><div style="text-align:center;padding:18px"><div class="crest" style="margin:auto">🏕️</div><h2 style="font-size:40px;color:var(--gold);margin:12px 0">THE LODGE</h2><p>Share <b style="color:var(--gold);letter-spacing:.14em">${state.code}</b> with each patrol. They can enter their name, members and matching token, then appear here live.</p><div class="main-actions" style="justify-content:center"><button class="btn gold" onclick="openPatrol()" ${myPatrol()?'disabled':''}>Join as patrol</button>${isHost()?`<button class="btn fire" onclick="startGame()">Start game</button>`:''}<button class="btn" onclick="copyCode()">Copy code</button></div></div><div><div class="panel-title">Connected patrols (${state.patrols.length})</div><div class="choice-grid">${state.patrols.length?state.patrols.map(p=>`<div class="choice"><b>${p.token} ${esc(p.name)}</b><br><small>${esc(p.members||'Members not listed')}</small><br><span class="pill">500 starting TP</span></div>`).join(''):'<p class="action-note">No patrols have checked in yet.</p>'}</div></div><div class="safety">The Patrol Leader rolls and moves. The score keeper records Trail Points, Honor, bases and cards. Every patrol begins with 500 TP.</div></section>`;
}

function spaceInfo(i){
  selectedSpace=i;
  const x=BOARD[i],own=x.type==='base'?state.bases[x.id]:null,owner=own?.ownerId?patrol(own.ownerId):null;
  setModal(`<button class="btn ghost" onclick="closeModal()">Close</button><h2>${esc(x.name)}</h2>${x.type==='base'?`<p>${owner?`Owned by <b>${esc(owner.name)}</b> at Level ${own.level}. Current rent: <b>${x.rents[own.level]} TP</b>.`:'Unowned Base.'}</p><div class="stat-grid"><div class="stat"><b>${x.cost}</b><span>Cost TP</span></div><div class="stat"><b>${x.upgrade}</b><span>Upgrade TP</span></div><div class="stat"><b>${x.rents.join(' / ')}</b><span>Rent L0 / L1 / L2 / L3</span></div><div class="stat"><b>${own?.level||0}</b><span>Current Level</span></div></div>`:x.type==='station'?`<p><b>${esc(x.station)}</b> is a physical 3-minute scouting challenge. Success gives a free upgrade or Game Master-selected TP reward.</p><p>Printed board face: ${x.face} TP.</p>`:x.type==='start'?'<p>Every time a patrol passes START, it collects +200 Trail Points automatically.</p>':x.type==='reflection'||x.type==='goto'?'<p>Reflection is a real board state. Unsafe behavior results in immediate Reflection and loss of Honor.</p>':`<p>${esc(x.type==='challenge'?'Draw a Challenge card; Game Master verifies Pass or Fail.':x.type==='law'?'Draw a Scout Law card and complete the behavior for its listed reward.':x.type==='spirit'?'Draw a Scout Spirit card and follow its special effect.':'Draw an Opportunity card and follow its printed instruction.')}</p>`}`);
}

function openCard(){
  const c=state.currentCard;
  if(!c)return;
  const p=patrol(c.patrolId),other=state.patrols.filter(x=>x.id!==p.id);
  let controls='';
  if(c.needsTarget)controls=other.map(x=>`<button class="btn gold" onclick="chooseCardTarget('${x.id}')">Choose ${esc(x.name)}</button>`).join('');
  else if(c.needsStation)controls=`<button class="btn gold" onclick="chooseSpecial('station')">Advance to nearest Station</button>`;
  else if(c.needsNight)controls=`<button class="btn gold" onclick="chooseSpecial('night')">Move to Night Hike Trail</button>`;
  else if(c.needsWilderness)controls=`<button class="btn gold" onclick="chooseSpecial('wilderness')">Reverse next 3 challenges</button>`;
  else if(c.type==='challenge'||c.type==='law')controls=`<button class="btn gold" onclick="resolveCard(true)">Game Master: PASS</button><button class="btn danger" onclick="resolveCard(false)">Game Master: FAIL</button>`;
  else controls=`<button class="btn gold" onclick="resolveCard(true)">Resolve card</button>`;
  setModal(`<button class="btn ghost" onclick="closeModal()">Close</button><div class="card-reveal"><div class="card-type">${c.type.toUpperCase()} · ${esc(p?.name)}</div><h3>${esc(c.name)}</h3><p>${esc(c.text)}</p>${c.type==='challenge'?`<p class="reward">PASS: +${c.success} TP</p><p class="penalty">FAIL: ${c.failure} TP</p>`:c.type==='law'&&typeof c.success==='number'?`<p class="reward">REWARD: +${c.success} TP</p>`:''}${c.autoPass?'<p class="reward">IRON WILL: automatic pass available</p>':''}</div><div class="modal-actions">${controls}</div>`);
}

function openStation(){
  const st=state.station,p=patrol(st.patrolId),elapsed=st.startedAt?Math.floor((now()-st.startedAt)/1000):0,left=Math.max(0,180-elapsed);
  if(st.rewardPending){
    const owned=p.ownedBases.filter(id=>state.bases[id].level<3);
    setModal(`<button class="btn ghost" onclick="closeModal()">Close</button><h2>Station success</h2><p>${esc(p.name)} completed ${esc(st.name)}. The Game Master chooses the official reward.</p><form id="station-reward"><label>Reward<select name="reward"><option value="upgrade">Free upgrade</option><option value="tp">Trail Points</option></select></label><label>TP amount (only if selected)<input name="amount" type="number" min="1"></label><label>Base for free upgrade<select name="base"><option value="">Select base</option>${owned.map(id=>`<option value="${id}">${baseById[id].name}</option>`).join('')}</select></label><div class="modal-actions"><button type="button" class="btn gold" onclick="stationReward()">Grant reward</button></div></form>`);
    return;
  }
  setModal(`<button class="btn ghost" onclick="closeModal()">Close</button><h2>Station Challenge</h2><p><b>${esc(st.name)}</b> — ${esc(p?.name)} leaves the board to complete the physical/scouting challenge.</p><div class="dice">⏱️ ${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</div><p>Only the Game Master confirms Pass or Fail. A station challenge lasts 3 minutes.</p><div class="modal-actions">${isHost()?`<button class="btn gold" onclick="stationStart()">Start timer</button><button class="btn gold" onclick="stationResolve(true)">PASS</button><button class="btn danger" onclick="stationResolve(false)">FAIL</button>`:'<span class="pill">Waiting for Game Master verification</span>'}</div>`);
}

async function useHeldCard(id){
  const p=myPatrol(),card=cardById[id];
  if(!p||!card)return;
  if(!canAct())return tell('Cards can be used only on your active turn.');
  await mutate(`${p.name} used ${card.name}.`,s=>{
    const x=s.patrols.find(q=>q.id===p.id);
    x.cards=x.cards.filter(c=>c.id!==id);
    if(id==='opportunity-11'||id==='spirit-1'){
      x.protected=true;
      event(s,`${x.name} is protected from one penalty or challenge failure.`);
    }else if(id==='spirit-6'){
      x.cards.push({id:'spirit-6',type:'spirit',name:'Iron Will'});
      event(s,`${x.name} readied Iron Will for their next Courage Challenge.`);
    }else throw Error('This card has no direct usable effect.');
  });
}

function openMobileInfo(){
  setModal(`<button class="btn ghost" onclick="closeModal()">Close</button><h2>Game information</h2><p><b>${myPatrol()?.name||'Game Master'}</b> · ${state.code}</p><div class="panel-title">Live activity</div>${state.events.slice(0,15).map(e=>`<p>${esc(e.message)}</p>`).join('')}<div class="modal-actions"><button class="btn" onclick="openRules()">Rules</button><button class="btn" onclick="openRules('patrol')">Patrol guide</button>${isHost()?`<button class="btn gold" onclick="openGM()">GM control</button>`:''}</div>`);
}

async function copyCode(){
  try{await navigator.clipboard.writeText(state.code);tell('Game code copied.')}catch{tell(`Game code: ${state.code}`)}
} 

function leaveGame(){
  unsub?.();
  state=null;
  gameId='';
  try{localStorage.removeItem('scoutopolyGame')}catch(e){}
  render();
}

Object.assign(window,{closeModal,openAuth,authEmail,doLogout,openCreate,openJoin,createGame,joinByCode,openPatrol,addPatrol,openRules,openTrade,proposeTrade,counterTrade,tradeDecision,openGM,gmAdjust,gmUnsafe,gmAdvance,gmPause,gmUndo,gmEnd,gmMove,gmSkip,gmCard,gmBase,gmTrigger,gmSettings,gmReset,resetDeck,openAwards,printCertificate,rollDice,resolveLanding,buyBase,passBase,upgradeBase,endTurn,stationStart,stationResolve,stationReward,openStation,openCard,resolveCard,chooseCardTarget,chooseSpecial,spaceInfo,useHeldCard,openMobileInfo,copyCode,startGame});

onAuthStateChanged(auth,async u=>{
  if(u){
    user=u;
    if(gameId)watchGame();
    else render();
  }else{
    try{await signInAnonymously(auth)}catch(e){console.error(e);render();tell('Firebase Authentication is unavailable. Enable Anonymous sign-in in Firebase.')}
  }
});

window.addEventListener('online',render);
window.addEventListener('offline',render);
</script></body></html>

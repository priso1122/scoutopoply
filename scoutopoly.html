  async function resolveStation(success){const p=room.pending,patrol=room.patrols[p.patrolId];await updateDoc(doc(db,'gameRooms',roomId),{action:'awaitingEnd',pending:null,[`patrols.${patrol.id}`]:{...patrol,tp:patrol.tp+(success?50:0)},lastResolution:`${patrol.name} ${success?'completed the station and gained 50 TP.':'returned from the station.'}`});await event(`${patrol.name} ${success?'completed':'attempted'} ${BOARD[p.space].name} Station.`);closeModal()}
  function showDecks(){const deck=(title,items)=>`<h3 style="margin:18px 0 6px;color:#1f6048">${title}</h3><div class="decks">${items.map(c=>`<div class="deck-card"><b>${escape(c.title)}</b>${escape(c.text)}<br><small>${c.reward?`+${c.reward} TP`:c.effect?`${c.effect>0?'+':''}${c.effect} TP`:''}</small></div>`).join('')}</div>`;openModal(`<h2>Official Scoutopoly decks</h2><p>Every card is taken from the supplied Complete Kit.</p>${deck('Challenges',CHALLENGES)}${deck('Opportunity',OPPORTUNITIES)}${deck('Scout Law',LAWS)}${deck('Scout Spirit',SPIRITS)}`)}
  function showTrade(){const options=patrols().filter(p=>p.id!==mine()?.id).map(p=>`<option value="${p.id}">${escape(p.name)}</option>`).join('');openModal(`<h2>Propose a trade</h2><p>Both patrols should confirm trade agreements; the Game Master can record any disputes.</p><div class="field"><label>Trade with</label><select id="trade-target">${options}</select></div><div class="field"><label>Trail Points you offer</label><input id="trade-offer" type="number" min="0" value="0"></div><div class="field"><label>Trail Points you request</label><input id="trade-request" type="number" min="0" value="0"></div><div class="modal-actions"><button class="primary" id="send-trade">Send proposal</button></div>`,()=>document.querySelector('#send-trade').onclick=async()=>{const target=document.querySelector('#trade-target').value,offer=Math.max(0,+document.querySelector('#trade-offer').value||0),request=Math.max(0,+document.querySelector('#trade-request').value||0);await addDoc(collection(db,'gameRooms',roomId,'trades'),{from:mine().id,to:target,offer,request,status:'proposed',createdAt:Date.now()});await event(`${mine().name} proposed a trade.`);tell('Trade proposal sent to the Game Master journal.');closeModal()})}
  function showHonor(){const options=patrols().map(p=>`<option value="${p.id}">${escape(p.name)}</option>`).join('');openModal(`<h2>Honor record</h2><div class="field"><label>Patrol</label><select id="honor-patrol">${options}</select></div><div class="field"><label>Official adjustment</label><select id="honor-value"><option value="10">+10 · Helping another patrol</option><option value="5">+5 · Exceptional teamwork</option><option value="-20">-20 · Cheating / unsafe behavior</option><option value="-10">-10 · Broken promise / trade</option></select></div><div class="modal-actions"><button class="primary" id="apply-honor">Record honor</button></div>`,()=>document.querySelector('#apply-honor').onclick=async()=>{const id=document.querySelector('#honor-patrol').value,value=+document.querySelector('#honor-value').value,p=room.patrols[id];await updateDoc(doc(db,'gameRooms',roomId),{[`patrols.${id}`]:{...p,honor:(p.honor||0)+value}});await event(`${p.name} ${value>0?'earned':'lost'} ${Math.abs(value)} Honor.`);closeModal()})}
  function showStationResolver(){if(room.pending?.kind==='station')showPending();else tell('No patrol is currently at a station.')}
  async function endGame(){const scores=patrols().map(p=>({...p,baseValue:(p.bases||[]).reduce((sum,n)=>sum+(BASES.find(b=>b.name===n)?.cost||0),0)})).map(p=>({...p,final:p.tp+p.baseValue+(p.honor||0)*10})).sort((a,b)=>b.final-a.final);await updateDoc(doc(db,'gameRooms',roomId),{phase:'ended',action:'ended',finalScores:scores,endedAt:Date.now()});await event(`${scores[0]?.name} became the Legendary Patrol with ${scores[0]?.final} points!`);openModal(`<h2>Final Flame Ceremony 🔥</h2><p>Final Score = Trail Points + Owned Base Values + (Honor × 10)</p><div class="decks">${scores.map((p,i)=>`<div class="deck-card"><b>#${i+1} ${p.emoji} ${escape(p.name)}</b>${p.tp} TP + ${p.baseValue} bases + ${(p.honor||0)*10} Honor = <strong>${p.final}</strong></div>`).join('')}</div><p><b>Official awards:</b> Legendary Patrol · Wisest Patrol · Bravest Patrol · Most Honorable Patrol · Best Teamwork · Best Scout Spirit</p>`)}
  function openModal(html,ready){modalRoot.innerHTML=`<div class="modal-layer"><section class="modal"><button class="close" aria-label="Close">×</button>${html}</section></div>`;modalRoot.querySelector('.close').onclick=closeModal;ready?.()};function closeModal(){modalRoot.innerHTML=''}

  // Completion pass: lobby roles, readiness, and trade decisions are persisted with the room.
  const baseRenderGame=renderGame,baseRenderMembers=renderMembers;
  renderGame=function(){baseRenderGame();if(!room)return;const myPatrol=mine(),hud=document.querySelector('.hud'),controls=document.querySelector('.board-controls'),gm=document.querySelector('.gm-actions');if(room.phase==='lobby'&&hud){hud.insertAdjacentHTML('beforeend',`<div class="modal-actions"><button class="quiet" id="ready-toggle">${room.members?.[me.uid]?.ready?'Unready':'Ready'}</button>${myPatrol?'<button class="warning" id="leave-patrol">Leave patrol</button>':''}</div>${myPatrol?`<div class="note">Your patrol: <b>${escape(myPatrol.name)}</b><br>Leader: ${escape(myPatrol.leaderName||'Unassigned')} · Score Keeper: ${escape(myPatrol.scoreKeeperName||'Unassigned')}</div>`:'<div class="note">Select a patrol, then mark yourself ready.</div>'}`);bindAction('#ready-toggle',room.members?.[me.uid]?.ready?'Updating...':'Getting ready...',toggleReady);bindAction('#leave-patrol','Leaving...',leavePatrol);bindAction('#add-patrol','Creating patrol...',addPatrol);bindAction('#start-game','Starting game...',startGame);document.querySelectorAll('.join-patrol').forEach(button=>bindAction(`[data-patrol="${button.dataset.patrol}"].join-patrol`,'Joining...',()=>joinPatrol(button.dataset.patrol)))}if(controls){controls.insertAdjacentHTML('afterbegin','<button class="quiet" id="center-board">Center patrol</button><button class="quiet" id="fit-board">Fit board</button><button class="quiet" id="view-cards">My cards</button><button class="quiet" id="view-rules">Rules & safety</button>');document.querySelector('#center-board').onclick=centerBoard;document.querySelector('#fit-board').onclick=fitBoard;document.querySelector('#view-cards').onclick=showMyCards;document.querySelector('#view-rules').onclick=showRules}if(gm){gm.insertAdjacentHTML('afterbegin','<button class="quiet" id="gm-tp">Adjust TP</button><button class="quiet" id="gm-reflection">Reflection</button><button class="quiet" id="gm-announce">Announce</button>');document.querySelector('#gm-tp').onclick=showTP;document.querySelector('#gm-reflection').onclick=showReflection;document.querySelector('#gm-announce').onclick=showAnnouncement;bindAction('#gm-pause',room.phase==='paused'?'Resuming...':'Pausing...',async()=>{if(!isGM())throw Error('Only the Game Master can pause the game.');await updateDoc(doc(db,'gameRooms',roomId),{phase:room.phase==='paused'?'playing':'paused'})});bindAction('#gm-end','Scoring...',endGame)}renderTrades()};
  renderMembers=function(){baseRenderMembers();const el=document.querySelector('#members');if(!el)return;Object.entries(room.members||{}).forEach(([uid,m],index)=>{const row=el.children[index];if(row)row.querySelector('small').textContent=m.ready?'Ready ✓':'Not ready'})};
  async function toggleReady(){const ref=doc(db,'gameRooms',roomId);await runTransaction(db,async tx=>{const snap=await tx.get(ref),data=snap.data();if(data.phase!=='lobby')throw Error('Ready status is only available in the lobby.');const member=data.members?.[me.uid];if(!member)throw Error('You are not in this camp.');tx.update(ref,{[`members.${me.uid}`]:{...member,ready:!member.ready},updatedAt:serverTimestamp()})})}
  async function leavePatrol(){const ref=doc(db,'gameRooms',roomId);await runTransaction(db,async tx=>{const snap=await tx.get(ref),data=snap.data(),patrol=Object.values(data.patrols||{}).find(p=>p.members?.includes(me.uid));if(data.phase!=='lobby')throw Error('Patrol assignments lock when the game begins.');if(!patrol)throw Error('You have not joined a patrol.');const members=patrol.members.filter(uid=>uid!==me.uid),nextLeader=members[0]||null,nextKeeper=patrol.scoreKeeperUid===me.uid?(members[1]||members[0]||null):patrol.scoreKeeperUid||null;tx.update(ref,{[`patrols.${patrol.id}`]:{...patrol,members,leaderUid:patrol.leaderUid===me.uid?nextLeader:patrol.leaderUid,leaderName:patrol.leaderUid===me.uid?(data.members?.[nextLeader]?.name||''):patrol.leaderName,scoreKeeperUid:nextKeeper,scoreKeeperName:data.members?.[nextKeeper]?.name||'',updatedAt:Date.now()},[`members.${me.uid}`]:{...data.members[me.uid],ready:false}})});await event(`${myName} left their patrol.`)}
  addPatrol=async function(){const choice=document.querySelector('#patrol-choice').value,custom=(document.querySelector('#custom-patrol').value||'').trim(),info=OFFICIAL_PATROLS.find(x=>x[0]===choice)||[custom||'New Patrol','🏕️','#557b6b'];if(!custom&&choice==='Custom Patrol')throw Error('Enter a custom patrol name.');if(patrols().some(p=>p.name.toLowerCase()===info[0].toLowerCase()))throw Error('That patrol is already in camp.');if(patrols().length>=room.maxPatrols)throw Error('This room has reached its patrol limit.');const id=key(info[0]),assignHost=!mine();await updateDoc(doc(db,'gameRooms',roomId),{[`patrols.${id}`]:{id,name:info[0],emoji:info[1],color:info[2],members:assignHost?[me.uid]:[],tp:500,honor:0,position:0,bases:[],cards:[],leaderUid:assignHost?me.uid:null,leaderName:assignHost?myName:'',scoreKeeperUid:null,scoreKeeperName:'',skip:0},updatedAt:serverTimestamp()});await event(`${info[0]} patrol arrived at camp.`)};
  joinPatrol=async function(id){const ref=doc(db,'gameRooms',roomId);await runTransaction(db,async tx=>{const snap=await tx.get(ref),data=snap.data();if(data.phase!=='lobby')throw Error('Patrols can only be joined before the game begins.');if(Object.values(data.patrols||{}).some(p=>p.members?.includes(me.uid)))throw Error('You are already assigned to a patrol.');const p=data.patrols[id];if(!p)throw Error('That patrol is no longer available.');const members=[...(p.members||[]),me.uid],keeper=p.scoreKeeperUid||me.uid;tx.update(ref,{[`patrols.${id}`]:{...p,members,leaderUid:p.leaderUid||me.uid,leaderName:p.leaderName||myName,scoreKeeperUid:keeper,scoreKeeperName:p.scoreKeeperName||myName}})});await event(`${myName} joined ${room.patrols[id]?.name||'a patrol'}.`)};
  startGame=async function(){if(!isHost())throw Error('Only the host can start the game.');if(patrols().length<2)throw Error('Add at least two patrols before starting.');if(patrols().some(p=>!p.leaderUid||!p.members?.length))throw Error('Each patrol needs a Patrol Leader before the game can start.');const unready=Object.values(room.members||{}).filter(member=>!member.ready);if(unready.length)throw Error('Every Scout must mark Ready before the game starts.');await updateDoc(doc(db,'gameRooms',roomId),{phase:'playing',action:'roll',turnIndex:0,turnNumber:1,updatedAt:serverTimestamp()});await event('The Game Master lit the campfire. Every patrol starts with 500 TP.');tell('The game has begun!')};
  function showMyCards(){const p=mine();openModal(`<h2>${escape(p?.name||'My patrol')} cards</h2>${p?.cards?.length?`<div class="decks">${p.cards.map(title=>`<div class="deck-card"><b>${escape(title)}</b>Held Scout Spirit / Opportunity card</div>`).join('')}</div>`:'<p>Your patrol has no held cards yet. Scout Spirit and Be Prepared cards appear here when earned.</p>'}`)}
  function showRules(){openModal('<h2>Scoutopoly rules</h2><p><b>Turn:</b> Roll · Move · Look · Act · Record · End.</p><p><b>START:</b> passing it earns +200 TP. <b>Final Score:</b> Trail Points + Owned Base Values + (Honor × 10).</p><div class="safety"><b>Safety first:</b> No running in the dark without flashlights. No physical contact during competitive challenges. Unsafe behaviour means immediate Reflection and -20 Honor.</div>')}
  function centerBoard(){const boardPanel=document.querySelector('.board-panel'),active=document.querySelector('.space.active');if(!boardPanel||!active)return tell('Your patrol is already centered on the board.');active.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})}
  function fitBoard(){const boardPanel=document.querySelector('.board-panel');if(!boardPanel)return;boardPanel.scrollTo({left:0,top:0,behavior:'smooth'});tell('Board reset to the full-camp view.')}
  function renderTrades(){const sidebar=document.querySelector('.right-col');if(!sidebar)return;document.querySelector('#trades-panel')?.remove();const trades=Object.entries(room.trades||{}).filter(([,trade])=>trade.status==='proposed');if(!trades.length)return;const p=mine();const panel=document.createElement('section');panel.id='trades-panel';panel.className='panel';panel.innerHTML=`<div class="panel-title">Trade proposals</div><div class="panel-body">${trades.map(([id,t])=>{const from=room.patrols[t.from],to=room.patrols[t.to],canAccept=p?.id===t.to,canCancel=p?.id===t.from;return `<div class="event"><b>${escape(from?.name||'Patrol')} → ${escape(to?.name||'Patrol')}</b><br>Offer ${t.offer} TP · Request ${t.request} TP<br>${canAccept?`<button class="quiet trade-accept" data-trade="${id}" style="padding:5px;margin-top:5px">Accept</button><button class="warning trade-reject" data-trade="${id}" style="padding:5px">Reject</button>`:canCancel?`<button class="warning trade-cancel" data-trade="${id}" style="padding:5px;margin-top:5px">Cancel</button>`:'Awaiting patrol response'}</div>`}).join('')}</div>`;sidebar.appendChild(panel);document.querySelectorAll('.trade-accept').forEach(b=>bindAction(`[data-trade="${b.dataset.trade}"].trade-accept`,'Accepting...',()=>resolveTrade(b.dataset.trade,'accepted')));document.querySelectorAll('.trade-reject').forEach(b=>bindAction(`[data-trade="${b.dataset.trade}"].trade-reject`,'Rejecting...',()=>resolveTrade(b.dataset.trade,'rejected')));document.querySelectorAll('.trade-cancel').forEach(b=>bindAction(`[data-trade="${b.dataset.trade}"].trade-cancel`,'Cancelling...',()=>resolveTrade(b.dataset.trade,'cancelled')))}
  async function resolveTrade(id,decision){const ref=doc(db,'gameRooms',roomId);await runTransaction(db,async tx=>{const snap=await tx.get(ref),data=snap.data(),trade=data.trades?.[id];if(!trade||trade.status!=='proposed')throw Error('This trade is no longer available.');const from=data.patrols[trade.from],to=data.patrols[trade.to],p=Object.values(data.patrols).find(x=>x.members?.includes(me.uid));if(decision==='accepted'){if(p?.id!==to.id)throw Error('Only the receiving patrol can accept this trade.');if(from.tp<trade.offer||to.tp<trade.request)throw Error('One patrol no longer has enough Trail Points.');tx.update(ref,{[`patrols.${from.id}`]:{...from,tp:from.tp-trade.offer+trade.request},[`patrols.${to.id}`]:{...to,tp:to.tp+trade.offer-trade.request},[`trades.${id}`]:{...trade,status:'accepted',resolvedAt:Date.now()}})}else{if(p?.id!==(decision==='cancelled'?from.id:to.id))throw Error('You cannot resolve this trade.');tx.update(ref,{[`trades.${id}`]:{...trade,status:decision,resolvedAt:Date.now()}})}});await event(`A trade was ${decision}.`)}
  function showTP(){const options=patrols().map(p=>`<option value="${p.id}">${escape(p.name)}</option>`).join('');openModal(`<h2>Trail Points adjustment</h2><div class="field"><label>Patrol</label><select id="tp-patrol">${options}</select></div><div class="field"><label>Amount (use negative to deduct)</label><input id="tp-value" type="number" value="10"></div><div class="modal-actions"><button class="primary" id="apply-tp">Record TP</button></div>`,()=>bindAction('#apply-tp','Recording...',async()=>{if(!isGM())throw Error('Only the Game Master can adjust Trail Points.');const id=document.querySelector('#tp-patrol').value,value=Number(document.querySelector('#tp-value').value),p=room.patrols[id];if(!Number.isFinite(value)||!value)throw Error('Enter a non-zero Trail Point amount.');await updateDoc(doc(db,'gameRooms',roomId),{[`patrols.${id}`]:{...p,tp:Math.max(0,p.tp+value)}});await event(`${p.name} ${value>0?'received':'lost'} ${Math.abs(value)} TP.`);closeModal()}))}
  function showReflection(){const options=patrols().map(p=>`<option value="${p.id}">${escape(p.name)}</option>`).join('');openModal(`<h2>Send to Reflection</h2><p>This applies the official unsafe-behaviour penalty: move to Reflection and -20 Honor.</p><div class="field"><label>Patrol</label><select id="reflection-patrol">${options}</select></div><div class="modal-actions"><button class="warning" id="apply-reflection">Confirm Reflection</button></div>`,()=>bindAction('#apply-reflection','Applying...',async()=>{if(!isGM())throw Error('Only the Game Master can trigger Reflection.');const id=document.querySelector('#reflection-patrol').value,p=room.patrols[id];await updateDoc(doc(db,'gameRooms',roomId),{[`patrols.${id}`]:{...p,position:39,honor:(p.honor||0)-20}});await event(`${p.name} was sent to Reflection and lost 20 Honor.`);closeModal()}))}
  function showAnnouncement(){openModal('<h2>Camp announcement</h2><div class="field"><label>Message</label><input id="announcement" maxlength="180" placeholder="Keep your flashlights ready."></div><div class="modal-actions"><button class="primary" id="send-announcement">Send announcement</button></div>',()=>bindAction('#send-announcement','Sending...',async()=>{if(!isGM())throw Error('Only the Game Master can announce to camp.');const message=document.querySelector('#announcement').value.trim();if(!message)throw Error('Write an announcement first.');await event(`GM announcement: ${message}`);closeModal()}))}
  showTrade=function(){const options=patrols().filter(p=>p.id!==mine()?.id).map(p=>`<option value="${p.id}">${escape(p.name)}</option>`).join('');if(!options)return tell('Another patrol must join before you can trade.');openModal(`<h2>Propose a trade</h2><p>Both patrols must confirm before Trail Points are exchanged.</p><div class="field"><label>Trade with</label><select id="trade-target">${options}</select></div><div class="field"><label>Trail Points you offer</label><input id="trade-offer" type="number" min="0" value="0"></div><div class="field"><label>Trail Points you request</label><input id="trade-request" type="number" min="0" value="0"></div><div class="modal-actions"><button class="primary" id="send-trade">Send proposal</button></div>`,()=>bindAction('#send-trade','Sending...',async()=>{const target=document.querySelector('#trade-target').value,offer=Math.max(0,+document.querySelector('#trade-offer').value||0),request=Math.max(0,+document.querySelector('#trade-request').value||0),from=mine();if(!from||(!offer&&!request))throw Error('Offer or request at least one Trail Point.');if(offer>from.tp)throw Error('Your patrol cannot offer more Trail Points than it has.');const id=crypto.randomUUID();await updateDoc(doc(db,'gameRooms',roomId),{[`trades.${id}`]:{from:from.id,to:target,offer,request,status:'proposed',createdAt:Date.now()}});await event(`${from.name} proposed a trade.`);closeModal()}))};
  onAuthStateChanged(auth,user=>{if(user){me=user;authFailure=null;document.querySelector('#connection').textContent='Scout identity ready';document.querySelector('.dot').style.background='#66d8a1';if(roomId)listenRoom();else renderLanding()}});signInAnonymously(auth).catch(error=>{authFailure=error;document.querySelector('#connection').textContent='Authentication needed';document.querySelector('.dot').style.background='#e65f3e';renderLanding();tell('Firebase sign-in failed. Serve this app over http(s), not file://, and enable Anonymous Authentication.')});
  window.addEventListener('hashchange',()=>{roomId=location.hash.slice(1).toUpperCase();if(roomId)listenRoom();else {unsubRoom?.();unsubEvents?.();room=null;renderLanding()}});
</script>
